name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # manual run from the Actions tab
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#16a34a&color_dots=#ebedf0,#a7f3d0,#4ade80,#22c55e,#15803d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#39ff8a&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
